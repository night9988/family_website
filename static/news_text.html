<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻浏览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f4f5f7;
            padding: 24px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .page-title {
            font-size: 28px;
            color: #222;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #3474d9;
        }
        .news-list {
            display: grid;
            gap: 20px;
        }
        .news-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: 0.2s ease;
        }
        .news-card:hover {
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }
        .news-title {
            font-size: 20px;
            color: #222;
            text-decoration: none;
            font-weight: 600;
            display: block;
            margin-bottom: 10px;
        }
        .news-title:hover {
            color: #3474d9;
        }
        .news-meta {
            font-size: 14px;
            color: #888;
            margin-bottom: 12px;
        }
        .news-desc {
            font-size: 15px;
            color: #555;
            line-height: 1.7;
        }
        .news-footer {
            margin-top: 14px;
            text-align: right;
        }
        .read-link {
            font-size: 14px;
            color: #3474d9;
            text-decoration: none;
        }
        .read-link:hover {
            text-decoration: underline;
        }
        .empty-tip {
            text-align: center;
            padding: 60px 0;
            color: #999;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="page-title">新闻资讯</h2>
        <div class="news-list">
            <!-- 新闻卡片，后端循环渲染这一块 -->
            <div class="news-card">
                <a href="#" class="news-title">示例新闻标题一</a>
                <div class="news-meta">发布时间：2026-11-25 18:30 | 来源：示例来源</div>
                <div class="news-desc">
                    这里是新闻摘要，简单概括新闻的主要内容，不会太长，吸引用户点击查看完整原文。
                </div>
                <div class="news-footer">
                    <a href="#" class="read-link">查看原文 →</a>
                </div>
            </div>
            <div class="news-card">
                <a href="#" class="news-title">示例新闻标题二</a>
                <div class="news-meta">发布时间：2026-11-25 20:10 | 来源：示例来源</div>
                <div class="news-desc">
                    这里是第二条新闻的摘要内容，后端后续把接口拿到的数据替换掉这里文字和链接即可。
                </div>
                <div class="news-footer">
                    <a href="#" class="read-link">查看原文 →</a>
                </div>
            </div>
            <!-- 没有新闻的时候展示这个 -->
            <!--
            <div class="empty-tip">暂无新闻</div>
            -->
        </div>
    </div>
</body>
</html>
